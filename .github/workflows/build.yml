name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Accept Pre-installed Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24a33b3b747e6fd53a308b3e228be00718c3a98d" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Web Distribution Directory
      run: |
        mkdir -p dist
        cp *.html *.js *.json *.png dist/ 2>/dev/null || true
        cp -r Styles Scripts Assets dist/ 2>/dev/null || true

    - name: Install Capacitor & Tools
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install -D sass
        npx sass dist/Styles:dist/Styles --no-source-map 2>/dev/null || true

    - name: Initialize Capacitor Config
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.bjhos.app",
          "appName": "BJH_OS",
          "webDir": "dist"
        }
        EOF

    - name: Add Android Platform & Sync
      run: |
        npx cap init BJH_OS com.bjhos.app --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Build Debug APK with Gradle
      run: |
        cd android
        
        # Inject standard gradle configurations matching Java 17
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.20"/' build.gradle 2>/dev/null || true
        
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BJH-OS-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
