name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Accept Pre-installed Android SDK Licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24a33b3b747e6fd53a308b3e228be00718c3a98d" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Web Distribution Directory
      run: |
        mkdir -p dist
        cp *.html *.js *.json *.png dist/ 2>/dev/null || true
        cp -r Styles Scripts Assets dist/ 2>/dev/null || true

    - name: Install Capacitor & Tools
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npm install -D sass
        npx sass dist/Styles:dist/Styles --no-source-map 2>/dev/null || true

    - name: Initialize Capacitor Config
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.bjhos.app",
          "appName": "BJH_OS",
          "webDir": "dist"
        }
        EOF

    - name: Add Android Platform & Sync
      run: |
        npx cap init BJH_OS com.bjhos.app --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Fix Kotlin & Duplicate Class Conflict
      run: |
        cd android
        # Build.gradle ফাইলে সঠিক কোটলিন ভার্সন এবং ডুপ্লিকেট ক্লাস রুলস ফোর্স করা হচ্ছে
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' build.gradle 2>/dev/null || true
        
        # অ্যাপ লেভেলের build.gradle ফাইলে এক্সক্লুশন রুলস এবং কনফ্লিক্ট রেজোলিউশন অ্যাড করা হচ্ছে
        cat << 'EOF' >> app/build.gradle
        
        configurations.all {
            resolutionStrategy {
                force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
            }
        }
        
        android {
            configurations.all {
                resolutionStrategy.dependencySubstitution {
                    substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.9.24')
                    substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.9.24')
                }
            }
        }
        EOF

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BJH-OS-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
